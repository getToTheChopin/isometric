<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Grid Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0ff;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #0ff;
            padding: 20px;
            min-width: 280px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .controls::-webkit-scrollbar {
            width: 8px;
        }

        .controls::-webkit-scrollbar-track {
            background: #000;
        }

        .controls::-webkit-scrollbar-thumb {
            background: #0ff;
            border-radius: 4px;
        }

        .controls h1 {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0ff;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0ff;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            background: #0ff;
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
            -webkit-appearance: none;
        }

        .control-group input[type="range"]:hover {
            opacity: 1;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #0ff;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
        }

        .control-group input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #0ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px #0ff;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 32px;
            border: 2px solid #0ff;
            background: #000;
            cursor: pointer;
        }

        .control-group .value {
            display: inline-block;
            float: right;
            color: #f0f;
            font-weight: bold;
            text-shadow: 0 0 5px #f0f;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 15px #0ff;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            font-size: 10px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="controls">
        <h1>◢ ISOMETRIC ◣</h1>

        <div class="control-group">
            <label>Grid Size <span class="value" id="gridSizeValue">50</span></label>
            <input type="range" id="gridSize" min="20" max="100" value="50" step="5">
        </div>

        <div class="control-group">
            <label>Topology Height <span class="value" id="heightValue">3.0</span></label>
            <input type="range" id="height" min="0" max="10" value="3" step="0.1">
        </div>

        <div class="control-group">
            <label>Noise Scale <span class="value" id="noiseScaleValue">0.10</span></label>
            <input type="range" id="noiseScale" min="0.01" max="0.5" value="0.1" step="0.01">
        </div>

        <div class="control-group">
            <label>Noise Octaves <span class="value" id="octavesValue">3</span></label>
            <input type="range" id="octaves" min="1" max="8" value="3" step="1">
        </div>

        <div class="control-group">
            <label>Wave Amplitude <span class="value" id="waveValue">0.0</span></label>
            <input type="range" id="wave" min="0" max="5" value="0" step="0.1">
        </div>

        <div class="control-group">
            <label>Wave Frequency <span class="value" id="waveFreqValue">1.0</span></label>
            <input type="range" id="waveFreq" min="0.1" max="5" value="1" step="0.1">
        </div>

        <div class="control-group">
            <label>Distortion <span class="value" id="distortionValue">0.0</span></label>
            <input type="range" id="distortion" min="0" max="2" value="0" step="0.1">
        </div>

        <div class="control-group">
            <label>Rotation Speed <span class="value" id="rotationValue">0.2</span></label>
            <input type="range" id="rotation" min="0" max="2" value="0.2" step="0.1">
        </div>

        <div class="control-group">
            <label>Bloom Strength <span class="value" id="bloomValue">1.5</span></label>
            <input type="range" id="bloom" min="0" max="3" value="1.5" step="0.1">
        </div>

        <div class="control-group">
            <label>Line Color</label>
            <input type="color" id="lineColor" value="#00ffff">
        </div>

        <div class="control-group">
            <label>Point Color</label>
            <input type="color" id="pointColor" value="#ff00ff">
        </div>

        <button id="regenerate">⟳ REGENERATE</button>
        <button id="randomize">◈ RANDOMIZE</button>
    </div>

    <div class="info">
        ISOMETRIC GRID GENERATOR v1.0 // THREE.JS
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 50, 150);

        // Isometric camera
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 40;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2,
            frustumSize * aspect / 2,
            frustumSize / 2,
            frustumSize / -2,
            0.1,
            1000
        );

        // Set isometric angle
        camera.position.set(30, 30, 30);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, // strength
            0.4, // radius
            0.85 // threshold
        );
        composer.addPass(bloomPass);

        // Parameters
        let params = {
            gridSize: 50,
            height: 3,
            noiseScale: 0.1,
            octaves: 3,
            wave: 0,
            waveFreq: 1,
            distortion: 0,
            rotation: 0.2,
            bloom: 1.5,
            lineColor: 0x00ffff,
            pointColor: 0xff00ff,
            time: 0
        };

        // Simplex-like noise function
        function noise(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;

            x -= Math.floor(x);
            y -= Math.floor(y);

            const u = fade(x);
            const v = fade(y);

            const a = (X + Y * 57) * 93;
            const b = (X + 1 + Y * 57) * 93;
            const c = (X + (Y + 1) * 57) * 93;
            const d = (X + 1 + (Y + 1) * 57) * 93;

            return lerp(v,
                lerp(u, hash(a), hash(b)),
                lerp(u, hash(c), hash(d))
            );
        }

        function hash(n) {
            n = Math.sin(n) * 43758.5453123;
            return n - Math.floor(n);
        }

        function fade(t) {
            return t * t * t * (t * (t * 6 - 15) + 10);
        }

        function lerp(t, a, b) {
            return a + t * (b - a);
        }

        function fbm(x, y, octaves) {
            let value = 0;
            let amplitude = 1;
            let frequency = 1;
            let maxValue = 0;

            for (let i = 0; i < octaves; i++) {
                value += amplitude * noise(x * frequency, y * frequency);
                maxValue += amplitude;
                amplitude *= 0.5;
                frequency *= 2;
            }

            return value / maxValue;
        }

        // Grid mesh group
        let gridGroup = new THREE.Group();
        scene.add(gridGroup);

        function createGrid() {
            // Clear existing grid
            while(gridGroup.children.length > 0) {
                const obj = gridGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
                gridGroup.remove(obj);
            }

            const size = params.gridSize;
            const halfSize = size / 2;
            const points = [];

            // Calculate heights for all vertices
            const heightMap = [];
            for (let i = 0; i <= size; i++) {
                heightMap[i] = [];
                for (let j = 0; j <= size; j++) {
                    const x = i - halfSize;
                    const z = j - halfSize;

                    let height = fbm(
                        x * params.noiseScale + params.time * 0.1,
                        z * params.noiseScale + params.time * 0.1,
                        params.octaves
                    ) * params.height;

                    // Add wave effect
                    if (params.wave > 0) {
                        const dist = Math.sqrt(x * x + z * z);
                        height += Math.sin(dist * params.waveFreq * 0.2 - params.time) * params.wave;
                    }

                    // Add distortion
                    if (params.distortion > 0) {
                        height += Math.sin(x * 0.5 + params.time) * Math.cos(z * 0.5 + params.time) * params.distortion;
                    }

                    heightMap[i][j] = height;
                    points.push(new THREE.Vector3(x, height, z));
                }
            }

            // Create grid lines
            const lineMaterial = new THREE.LineBasicMaterial({
                color: params.lineColor,
                transparent: true,
                opacity: 0.8
            });

            // Horizontal lines
            for (let i = 0; i <= size; i++) {
                const linePoints = [];
                for (let j = 0; j <= size; j++) {
                    const x = i - halfSize;
                    const z = j - halfSize;
                    linePoints.push(new THREE.Vector3(x, heightMap[i][j], z));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(linePoints);
                const line = new THREE.Line(geometry, lineMaterial);
                gridGroup.add(line);
            }

            // Vertical lines
            for (let j = 0; j <= size; j++) {
                const linePoints = [];
                for (let i = 0; i <= size; i++) {
                    const x = i - halfSize;
                    const z = j - halfSize;
                    linePoints.push(new THREE.Vector3(x, heightMap[i][j], z));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(linePoints);
                const line = new THREE.Line(geometry, lineMaterial);
                gridGroup.add(line);
            }

            // Add points at intersections
            const pointsGeometry = new THREE.BufferGeometry().setFromPoints(points);
            const pointsMaterial = new THREE.PointsMaterial({
                color: params.pointColor,
                size: 0.15,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });
            const pointsMesh = new THREE.Points(pointsGeometry, pointsMaterial);
            gridGroup.add(pointsMesh);

            // Add vertical pillars at peaks
            const peakThreshold = params.height * 0.6;
            for (let i = 0; i <= size; i += 5) {
                for (let j = 0; j <= size; j += 5) {
                    if (heightMap[i][j] > peakThreshold) {
                        const x = i - halfSize;
                        const z = j - halfSize;
                        const pillarPoints = [
                            new THREE.Vector3(x, 0, z),
                            new THREE.Vector3(x, heightMap[i][j], z)
                        ];
                        const pillarGeometry = new THREE.BufferGeometry().setFromPoints(pillarPoints);
                        const pillarMaterial = new THREE.LineBasicMaterial({
                            color: params.pointColor,
                            transparent: true,
                            opacity: 0.4
                        });
                        const pillar = new THREE.Line(pillarGeometry, pillarMaterial);
                        gridGroup.add(pillar);
                    }
                }
            }
        }

        // Initialize grid
        createGrid();

        // UI Controls
        document.getElementById('gridSize').addEventListener('input', (e) => {
            params.gridSize = parseInt(e.target.value);
            document.getElementById('gridSizeValue').textContent = params.gridSize;
            createGrid();
        });

        document.getElementById('height').addEventListener('input', (e) => {
            params.height = parseFloat(e.target.value);
            document.getElementById('heightValue').textContent = params.height.toFixed(1);
            createGrid();
        });

        document.getElementById('noiseScale').addEventListener('input', (e) => {
            params.noiseScale = parseFloat(e.target.value);
            document.getElementById('noiseScaleValue').textContent = params.noiseScale.toFixed(2);
            createGrid();
        });

        document.getElementById('octaves').addEventListener('input', (e) => {
            params.octaves = parseInt(e.target.value);
            document.getElementById('octavesValue').textContent = params.octaves;
            createGrid();
        });

        document.getElementById('wave').addEventListener('input', (e) => {
            params.wave = parseFloat(e.target.value);
            document.getElementById('waveValue').textContent = params.wave.toFixed(1);
            createGrid();
        });

        document.getElementById('waveFreq').addEventListener('input', (e) => {
            params.waveFreq = parseFloat(e.target.value);
            document.getElementById('waveFreqValue').textContent = params.waveFreq.toFixed(1);
            createGrid();
        });

        document.getElementById('distortion').addEventListener('input', (e) => {
            params.distortion = parseFloat(e.target.value);
            document.getElementById('distortionValue').textContent = params.distortion.toFixed(1);
            createGrid();
        });

        document.getElementById('rotation').addEventListener('input', (e) => {
            params.rotation = parseFloat(e.target.value);
            document.getElementById('rotationValue').textContent = params.rotation.toFixed(1);
        });

        document.getElementById('bloom').addEventListener('input', (e) => {
            params.bloom = parseFloat(e.target.value);
            document.getElementById('bloomValue').textContent = params.bloom.toFixed(1);
            bloomPass.strength = params.bloom;
        });

        document.getElementById('lineColor').addEventListener('input', (e) => {
            params.lineColor = parseInt(e.target.value.replace('#', '0x'));
            createGrid();
        });

        document.getElementById('pointColor').addEventListener('input', (e) => {
            params.pointColor = parseInt(e.target.value.replace('#', '0x'));
            createGrid();
        });

        document.getElementById('regenerate').addEventListener('click', () => {
            params.time = Math.random() * 1000;
            createGrid();
        });

        document.getElementById('randomize').addEventListener('click', () => {
            params.height = Math.random() * 8 + 2;
            params.noiseScale = Math.random() * 0.3 + 0.05;
            params.octaves = Math.floor(Math.random() * 6) + 2;
            params.wave = Math.random() * 4;
            params.waveFreq = Math.random() * 3 + 0.5;
            params.distortion = Math.random() * 1.5;
            params.bloom = Math.random() * 2 + 0.5;

            document.getElementById('height').value = params.height;
            document.getElementById('heightValue').textContent = params.height.toFixed(1);
            document.getElementById('noiseScale').value = params.noiseScale;
            document.getElementById('noiseScaleValue').textContent = params.noiseScale.toFixed(2);
            document.getElementById('octaves').value = params.octaves;
            document.getElementById('octavesValue').textContent = params.octaves;
            document.getElementById('wave').value = params.wave;
            document.getElementById('waveValue').textContent = params.wave.toFixed(1);
            document.getElementById('waveFreq').value = params.waveFreq;
            document.getElementById('waveFreqValue').textContent = params.waveFreq.toFixed(1);
            document.getElementById('distortion').value = params.distortion;
            document.getElementById('distortionValue').textContent = params.distortion.toFixed(1);
            document.getElementById('bloom').value = params.bloom;
            document.getElementById('bloomValue').textContent = params.bloom.toFixed(1);

            bloomPass.strength = params.bloom;
            params.time = Math.random() * 1000;
            createGrid();
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the grid
            if (params.rotation > 0) {
                gridGroup.rotation.y += params.rotation * 0.005;
            }

            params.time += 0.01;

            composer.render();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = frustumSize * aspect / -2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
